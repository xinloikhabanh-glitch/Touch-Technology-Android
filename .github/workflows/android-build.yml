name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén mã nguồn
        shell: bash
        run: |
          if [ ! -f android-src.zip ]; then
            echo "THIẾU FILE android-src.zip ở thư mục gốc repo. Hãy upload file này lên repo."
            exit 1
          fi
          unzip -oq android-src.zip
          ls -la
          test -f app/src/main/java/com/leviz/touchtech/Ui.kt || { echo "Zip không đúng cấu trúc"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Hiện lỗi biên dịch
        if: failure()
        shell: bash
        run: |
          grep -n -A2 -E '^e: |What went wrong|error:' build.log | head -80 || true

      - uses: actions/upload-artifact@v4
        with:
          name: TouchTechnology-apk
          path: app/build/outputs/apk/release/*.apk
